name = "mocu-api"
type = "service"
main = "src/index.ts"
compatibility_date = "2025-03-25"

[env.development]
name = "mocu-api-dev"

[env.production]
name = "mocu-api-prod"

[[d1_databases]]
binding = "DB"
database_name = "mocu-db"
database_id = "805ab76b-c908-49ad-be5d-2a5040bae84a"

[[kv_namespaces]]
binding = "KV"

[vars]
API_VERSION = "1.0.0"
LOG_LEVEL = "info"
TELEGRAM_BOT_USERNAME = "mymocubot"

# Secrets (set via: wrangler secret put NAME --env production)
# TELEGRAM_BOT_TOKEN
# TELEGRAM_SECRET
# JWT_SECRET
# GEMINI_API_KEY
